<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf4e7">
<title>Trading performance vs. the S&amp;P 500</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23c45c0c%22/%3E%3Cpath d=%22M7 22l6-7 5 4 7-9%22 stroke=%22white%22 stroke-width=%223%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-6 4 3 7-9"/></svg></div>
    <div><div class="brand-name">Trading Performance</div><div class="brand-sub">vs. the S&amp;P 500</div></div>
  </div>
  <nav id="sideNav"></nav>
  <div class="sidebar-foot">
    <div class="price-pill" id="pricePill"><span class="dot"></span><span>No prices yet</span></div>
    <button class="btn" id="sideRefresh" type="button"></button>
  </div>
</aside>
<div class="main">
  <header class="topbar" id="topbar">
    <div class="topbar-title"><h1 id="viewTitle">Overview</h1><div class="sub" id="viewSub"></div></div>
    <div class="topbar-actions">
      <select class="select" id="acctSelect" aria-label="Account" hidden></select>
      <button class="btn" id="refreshBtn" type="button"></button>
      <button class="btn accent" id="uploadBtn" type="button"></button>
    </div>
  </header>
  <main id="view" class="view"></main>
</div>
<nav class="tabbar" id="tabBar"></nav>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"><div class="grabber"></div><div class="drawer-head"><h3 id="drawerTitle"></h3><button class="btn ghost icon-btn" id="drawerClose" type="button" aria-label="Close">✕</button></div><div class="drawer-body" id="drawerBody"></div></aside>
<div class="toasts" id="toasts"></div>
<div class="drop-veil" id="dropVeil"><div>Drop CSV files to import</div></div>
<input type="file" id="fileInput" accept=".csv,text/csv" multiple hidden>
<script src="engine.js"></script>
<script src="portfolio.js"></script>
<script src="news.js"></script>
<script src="economy.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
