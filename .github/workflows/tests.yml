name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JavaScript tests
        shell: bash
        run: for t in tests/test-*.js; do echo "== $t"; node "$t" || exit 1; done
      - name: Server tests
        run: python tests/test_server.py
      - name: HTTP / security tests
        run: python tests/test_http.py
